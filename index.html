<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TD School – Linklər</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --navy:#13289B; --red:#E31E2B; --bg:#F6F8FD; --line:#D6DDF0; --ink:#1B2447; --soft:#5C6688; --card:#fff; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',sans-serif;padding:20px 16px 48px;}
  .wrap{max-width:720px;margin:0 auto;}
  .logo{display:block;margin:0 auto 6px;width:min(260px,65vw);height:auto;}
  .sub{text-align:center;color:var(--soft);margin:0 0 22px;font-weight:700;}
  .levels{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-bottom:26px;}
  .lvl{flex:0 0 calc(33.333% - 7px);font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.15rem;cursor:pointer;padding:16px 8px;
    border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--navy);
    box-shadow:0 5px 0 rgba(19,40,155,.08);transition:transform .15s;}
  .lvl:hover{transform:translateY(-2px);}
  .lvl.active{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 5px 0 var(--red);}
  h2{font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.3rem;margin:0 0 12px;color:var(--navy);}
  h2 .badge{background:var(--red);color:#fff;border-radius:8px;padding:2px 12px;margin-left:6px;}
  .list{display:flex;flex-direction:column;gap:10px;}
  .item{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);
    border-radius:14px;padding:6px 6px 6px 14px;}
  .item a{flex:1;display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);font-weight:800;padding:10px 0;}
  .num{background:var(--navy);color:#fff;border-radius:50%;width:30px;height:30px;display:grid;place-items:center;
    font-family:'Fredoka',sans-serif;font-size:.95rem;flex:none;}
  .arrow{margin-left:auto;color:var(--red);font-weight:800;}
  .item:hover{border-color:var(--navy);}
  .mv{border:0;background:#E8ECFA;color:var(--navy);border-radius:10px;width:36px;padding:8px 0;cursor:pointer;font-weight:800;font-size:1rem;}
  .mv:disabled{opacity:.3;cursor:default;}
  .del{border:0;background:#FDE7E9;color:var(--red);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:800;}
  .empty{color:var(--soft);font-style:italic;padding:14px 0;}
  .admin-bar{text-align:center;margin-top:36px;}
  .link-btn{background:none;border:0;color:var(--soft);cursor:pointer;font:inherit;font-size:.85rem;text-decoration:underline;}
  .panel{background:var(--card);border:2px dashed var(--navy);border-radius:16px;padding:16px;margin-top:14px;}
  .panel h3{font-family:'Fredoka',sans-serif;margin:0 0 10px;color:var(--navy);}
  .panel input,.panel select{width:100%;padding:11px 12px;margin-bottom:10px;border:2px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:var(--ink);}
  .btn{background:var(--red);color:#fff;border:0;border-radius:12px;padding:11px 20px;font-family:'Fredoka',sans-serif;font-size:1rem;cursor:pointer;}
  .btn.alt{background:var(--navy);}
  .msg{margin:8px 0 0;font-weight:700;font-size:.9rem;}
  .msg.err{color:var(--red);} .msg.ok{color:#2a8a4f;}
  .warn{background:#FFF6D6;border:2px solid #F2B705;border-radius:12px;padding:10px 12px;margin:0 0 18px;font-size:.88rem;}
  [hidden]{display:none !important;}
</style>
</head>

<script>
/* ===== AYARLAR ===== */
const LEVELS = ["Pre-A1", "A1", "A2/B1", "B1+/B2", "C1/C2"];
const ADMIN_PASSWORD = "td.link2026";
// Google Apps Script linkini bura yaz (links_script.gs deploy edəndən sonra).
// Boş qalsa, linklər yalnız bu brauzerdə saxlanılır (test rejimi).
const LINKS_API = "";

let links = [], current = LEVELS[0], isAdmin = false, adminPass = "";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function loadLinks(){
  if(LINKS_API){
    const r = await fetch(LINKS_API);
    const j = await r.json();
    links = j.links || [];
  } else {
    try{ links = JSON.parse(localStorage.getItem('td_links') || '[]'); }catch(e){ links = []; }
  }
}
function saveLocal(){ try{ localStorage.setItem('td_links', JSON.stringify(links)); }catch(e){} }

async function post(payload){
  const r = await fetch(LINKS_API, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({...payload, password: adminPass}) });
  const j = await r.json();
  if(!j.ok) throw new Error(j.error || 'Xəta baş verdi');
}

function renderLevels(){
  $('levels').innerHTML = LEVELS.map(l => `<button class="lvl ${l===current?'active':''}" data-l="${esc(l)}">${esc(l)}</button>`).join('');
  $('levels').querySelectorAll('.lvl').forEach(b => b.onclick = () => { current = b.dataset.l; $('newLevel').value = current; render(); });
}
function renderList(){
  $('lvlTitle').innerHTML = `Səviyyə: <span class="badge">${esc(current)}</span>`;
  const items = links.filter(x => x.level === current);
  if(!items.length){ $('list').innerHTML = '<div class="empty">Bu səviyyədə hələ link yoxdur.</div>'; return; }
  $('list').innerHTML = items.map((x,i) => `
    <div class="item">
      <a href="${esc(x.url)}" target="_blank" rel="noopener"><span class="num">${i+1}</span>${esc(x.title)}<span class="arrow">Aç →</span></a>
      ${isAdmin ? `<button class="mv" data-id="${esc(x.id)}" data-d="up" title="Yuxarı" ${i===0?'disabled':''}>↑</button><button class="mv" data-id="${esc(x.id)}" data-d="down" title="Aşağı" ${i===items.length-1?'disabled':''}>↓</button><button class="del" data-id="${esc(x.id)}">Sil</button>` : ''}
    </div>`).join('');
  $('list').querySelectorAll('.del').forEach(b => b.onclick = () => removeLink(b.dataset.id));
  $('list').querySelectorAll('.mv').forEach(b => b.onclick = () => moveLink(b.dataset.id, b.dataset.d));
}
function render(){ renderLevels(); renderList(); }

async function moveLink(id, dir){
  const same = links.filter(x => x.level === current);
  const i = same.findIndex(x => String(x.id) === String(id));
  const j = dir === 'up' ? i - 1 : i + 1;
  if(i < 0 || j < 0 || j >= same.length) return;
  const a = links.indexOf(same[i]), b = links.indexOf(same[j]);
  [links[a], links[b]] = [links[b], links[a]];
  renderList();
  if(LINKS_API){
    try{ await post({action:'move', id, direction: dir}); }
    catch(e){ alert('Sıra saxlanmadı: ' + e.message); try{ await loadLinks(); }catch(x){} renderList(); }
  } else { saveLocal(); }
}

async function removeLink(id){
  if(!confirm('Bu link silinsin?')) return;
  try{
    if(LINKS_API){ await post({action:'delete', id}); await loadLinks(); }
    else { links = links.filter(x => String(x.id) !== String(id)); saveLocal(); }
    renderList();
  }catch(e){ alert('Silinmədi: ' + e.message); }
}

$('adminToggle').onclick = () => {
  if(isAdmin) return;
  $('loginPanel').hidden = !$('loginPanel').hidden;
  if(!$('loginPanel').hidden) $('pass').focus();
};
function login(){
  if($('pass').value === ADMIN_PASSWORD){
    isAdmin = true; adminPass = $('pass').value; $('pass').value = '';
    $('loginPanel').hidden = true; $('addPanel').hidden = false; $('adminToggle').hidden = true;
    $('loginMsg').textContent = ''; renderList();
  } else { $('loginMsg').textContent = 'Parol səhvdir.'; }
}
$('loginBtn').onclick = login;
$('pass').onkeydown = e => { if(e.key === 'Enter') login(); };
$('logoutBtn').onclick = () => { isAdmin = false; adminPass = ''; $('addPanel').hidden = true; $('adminToggle').hidden = false; renderList(); };

$('addBtn').onclick = async () => {
  const level = $('newLevel').value, title = $('newTitle').value.trim(), url = $('newUrl').value.trim();
  const msg = $('addMsg'); msg.className = 'msg';
  if(!title || !url){ msg.className = 'msg err'; msg.textContent = 'Ad və link boş ola bilməz.'; return; }
  if(!/^https?:\/\//i.test(url)){ msg.className = 'msg err'; msg.textContent = 'Link https:// ilə başlamalıdır.'; return; }
  $('addBtn').disabled = true; msg.textContent = 'Əlavə olunur...';
  try{
    if(LINKS_API){ await post({action:'add', level, title, url}); await loadLinks(); }
    else { links.push({id: Date.now(), level, title, url}); saveLocal(); }
    $('newTitle').value = ''; $('newUrl').value = '';
    current = level; render();
    msg.className = 'msg ok'; msg.textContent = '✅ Link əlavə olundu.';
  }catch(e){ msg.className = 'msg err'; msg.textContent = 'Xəta: ' + e.message; }
  $('addBtn').disabled = false;
};

(async function init(){
  $('newLevel').innerHTML = LEVELS.map(l => `<option>${esc(l)}</option>`).join('');
  if(!LINKS_API){
    $('warn').hidden = false;
    $('warn').textContent = '⚠️ Test rejimi: linklər yalnız bu brauzerdə saxlanılır. Hamıya görünməsi üçün Google Apps Script bağla (LINKS_API).';
  }
  render();
  try{ await loadLinks(); }catch(e){ $('warn').hidden = false; $('warn').textContent = '⚠️ Linklər yüklənmədi. İnternet bağlantısını və LINKS_API linkini yoxla.'; }
  render();
})();
</script>
